<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Health</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.5rem 1rem; }
      dt { font-weight: bold; }
    </style>
  </head>
  <body>
    <p><a href="/">Back to jobs</a></p>
    <h1>System Health</h1>
    <dl id="stats"></dl>

    <script>
      const stats = document.getElementById('stats');

      function mb(value) {
        return `${(value / 1024 / 1024).toFixed(2)} MB`;
      }

      async function loadHealth() {
        const response = await fetch('/api/health');
        const body = await response.json();

        if (!response.ok) {
          stats.innerHTML = `<dt>Error</dt><dd>${body.error || 'Unable to load health.'}</dd>`;
          return;
        }

        stats.innerHTML = `
          <dt>Host</dt><dd>${body.hostname}</dd>
          <dt>CPU usage</dt><dd>${body.cpu.usagePercent.toFixed(2)}%</dd>
          <dt>Memory used</dt><dd>${mb(body.memory.usedBytes)} / ${mb(body.memory.totalBytes)}</dd>
          <dt>Memory free</dt><dd>${mb(body.memory.freeBytes)}</dd>
          <dt>Network rx bytes</dt><dd>${body.network.rxBytes}</dd>
          <dt>Network tx bytes</dt><dd>${body.network.txBytes}</dd>
          <dt>Network rx/sec</dt><dd>${body.network.rxSec}</dd>
          <dt>Network tx/sec</dt><dd>${body.network.txSec}</dd>
          <dt>Disk free</dt><dd>${mb(body.storage.freeBytes)} / ${mb(body.storage.totalBytes)}</dd>
          <dt>Updated</dt><dd>${new Date(body.timestamp).toLocaleString()}</dd>
        `;
      }

      loadHealth();
      setInterval(loadHealth, 3000);
    </script>
  </body>
</html>
