<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ssYTDLP Jobs</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
      input { flex: 1; padding: 0.5rem; }
      button { padding: 0.5rem 1rem; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    </style>
  </head>
  <body>
    <h1>YouTube Music Downloader Jobs</h1>
    <p><a href="/health">System health</a></p>
    <form id="job-form">
      <input id="url" type="url" required placeholder="https://music.youtube.com/..." />
      <button type="submit">Create job</button>
    </form>
    <div id="message"></div>

    <table>
      <thead>
        <tr>
          <th>Job ID</th>
          <th>Type</th>
          <th>Status</th>
          <th>Created</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody id="jobs"></tbody>
    </table>

    <script>
      const jobsBody = document.getElementById('jobs');
      const message = document.getElementById('message');

      async function loadJobs() {
        const response = await fetch('/api/jobs');
        const jobs = await response.json();
        jobsBody.innerHTML = jobs.map((job) => `
          <tr>
            <td>${job.id}</td>
            <td>${job.isPlaylist ? 'Playlist' : 'Song'}</td>
            <td>${job.status}</td>
            <td>${new Date(job.createdAt).toLocaleString()}</td>
            <td><a href="/job/${job.id}">Open</a></td>
          </tr>
        `).join('');
      }

      document.getElementById('job-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        message.textContent = '';
        const url = document.getElementById('url').value;

        const response = await fetch('/api/jobs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const body = await response.json();
        if (!response.ok) {
          message.textContent = body.error || 'Unable to create job';
          return;
        }

        document.getElementById('url').value = '';
        message.textContent = `Job ${body.id} created.`;
        await loadJobs();
      });

      loadJobs();
      setInterval(loadJobs, 5000);
    </script>
  </body>
</html>
