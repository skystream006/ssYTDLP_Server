<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Details</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      li { margin-bottom: 0.4rem; }
      code { background: #f4f4f4; padding: 0.2rem 0.4rem; display: inline-block; }
    </style>
  </head>
  <body>
    <p><a href="/">Back to jobs</a></p>
    <h1>Job Details</h1>
    <div id="summary"></div>
    <h2>Files</h2>
    <ul id="files"></ul>

    <script>
      const id = window.location.pathname.split('/').pop();
      const summary = document.getElementById('summary');
      const filesList = document.getElementById('files');

      async function load() {
        const [jobRes, filesRes] = await Promise.all([
          fetch(`/api/jobs/${id}`),
          fetch(`/api/jobs/${id}/files`)
        ]);

        if (!jobRes.ok) {
          summary.textContent = 'Job not found.';
          filesList.innerHTML = '';
          return;
        }

        const job = await jobRes.json();
        const filesPayload = filesRes.ok ? await filesRes.json() : { files: [] };

        summary.innerHTML = `
          <p>Status: <strong>${job.status}</strong></p>
          <p>URL: <code>${job.url}</code></p>
          <p>Folder: <code>${job.folderName || '-'}</code></p>
          ${job.error ? `<p>Error: <code>${job.error}</code></p>` : ''}
        `;

        filesList.innerHTML = filesPayload.files.length
          ? filesPayload.files.map((file) => `<li><a href="${file.downloadUrl}">${file.name}</a> (${file.sizeBytes} bytes)</li>`).join('')
          : '<li>No downloadable files yet.</li>';
      }

      load();
      setInterval(load, 5000);
    </script>
  </body>
</html>
